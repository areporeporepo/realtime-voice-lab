<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>Form D Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #fbfbfd;
    --ink:     #14161d;
    --muted:   #8b90a0;
    --hairline:#e8e9ef;
    --chip:    #ffffff;
    --sans: 'Instrument Sans', -apple-system, system-ui, sans-serif;
    --serif:'Instrument Serif', Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: max(14px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
  }

  /* a whisper of colour bleeding up from the sphere, so white is not flat */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 45% at 50% 52%,
                rgba(150,164,246,.10), transparent 70%);
  }

  /* ---------- top rail ---------- */
  header { display: flex; align-items: center; justify-content: space-between; z-index: 3; }

  .pip {
    width: 40px; height: 40px; border-radius: 999px; padding: 0;
    background: var(--chip); border: 1px solid var(--hairline);
    color: var(--ink); cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(20,22,29,.04);
    transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s, opacity .2s;
  }
  .pip:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(20,22,29,.08); }
  .pip svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
             stroke-width: 1.7; stroke-linecap: round; }
  .pip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .title { text-align: center; line-height: 1.15; }
  .title b { font-family: var(--serif); font-weight: 400; font-size: 19px; }
  .title b i { font-style: italic; color: #7d8bef; }
  .title span { display: block; color: var(--muted); font-size: 10px;
                letter-spacing: .09em; text-transform: uppercase; margin-top: 1px; }

  /* ---------- stage ---------- */
  main { position: relative; display: grid; place-items: center; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .meter {
    position: absolute; bottom: 6%; font-family: var(--mono); font-size: 11px;
    color: var(--muted); letter-spacing: .02em;
    opacity: 0; transition: opacity .5s;
  }
  .meter.show { opacity: 1; }

  .feed {
    position: absolute; inset: auto 0 0; max-height: 46%; overflow-y: auto;
    padding: 0 4px; font-size: 13.5px; line-height: 1.65;
    mask-image: linear-gradient(transparent, #000 20%);
    -webkit-mask-image: linear-gradient(transparent, #000 20%);
    scrollbar-width: none; display: none;
  }
  .feed.show { display: block; }
  .feed::-webkit-scrollbar { display: none; }
  .feed > div { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; margin-bottom: 7px; }
  .feed .who { color: var(--muted); font-size: 9.5px; letter-spacing: .14em;
               text-transform: uppercase; margin-right: 8px; }
  .ai   { color: #4b5bd6; }
  .call { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .err  { color: #d0574a; }

  /* ---------- bottom rail ---------- */
  footer { display: flex; align-items: center; gap: 10px; z-index: 3; }

  .bar {
    flex: 1; min-width: 0; height: 52px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--hairline);
    display: flex; align-items: center; padding: 0 20px;
    color: var(--muted); box-shadow: 0 1px 2px rgba(20,22,29,.04);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .bar em { font-family: var(--serif); font-style: italic; color: var(--ink); }
  .bar.live { color: #4b5bd6; }
  .bar.bad  { color: #d0574a; font-size: 12px; }
  .bar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-family: var(--sans); font-size: 16px; color: var(--ink);
  }
  .bar input::placeholder { color: var(--muted); letter-spacing: 0; }

  .round {
    width: 52px; height: 52px; flex: none; border-radius: 999px; padding: 0;
    cursor: pointer; display: grid; place-items: center;
    background: var(--chip); border: 1px solid var(--hairline); color: var(--ink);
    box-shadow: 0 1px 2px rgba(20,22,29,.04);
    transition: transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s, background .2s;
  }
  .round:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(20,22,29,.09); }
  .round svg { width: 20px; height: 20px; fill: none; stroke: currentColor;
               stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .round.muted { background: #fff3e2; border-color: #f0d3a8; color: #a86a12; }
  .round.dark  { background: var(--ink); color: #fff; border-color: var(--ink); }
  .round.go    { background: var(--ink); color: #fff; border-color: var(--ink);
                 width: auto; padding: 0 26px; font-family: var(--sans);
                 font-size: 14px; font-weight: 500; }
  [hidden] { display: none !important; }

  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @media (max-width: 560px) {
    .title b { font-size: 16px; } .title span { display: none; }
    .bar { padding: 0 15px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; } }
</style>
</head>
<body>

<header>
  <button class="pip" id="btnFeed" aria-label="Toggle transcript">
    <svg viewBox="0 0 24 24"><path d="M4 8h16M4 14h11"/></svg>
  </button>
  <div class="title">
    <b>Form D <i>Analyst</i></b>
    <span>32,374 filings &middot; <span id="model">idle</span></span>
  </div>
  <button class="pip" id="btnMeter" aria-label="Toggle readout">
    <svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2.1"/><circle cx="15" cy="16" r="2.1"/></svg>
  </button>
</header>

<main>
  <canvas id="orb"></canvas>
  <div class="meter" id="meter">&mdash;</div>
  <div class="feed" id="feed"></div>
</main>

<footer>
  <div class="bar" id="bar">Ask in English, <em>&#20013;&#25991;</em>, or <em>Ti&#7871;ng Vi&#7879;t</em></div>
  <button class="round go" id="go">Start</button>
  <button class="round" id="mute" hidden aria-label="Mute microphone">
    <svg viewBox="0 0 24 24"><path d="M12 3.2a2.9 2.9 0 0 1 2.9 2.9v5.8a2.9 2.9 0 0 1-5.8 0V6.1A2.9 2.9 0 0 1 12 3.2z"/><path d="M5.4 11a6.6 6.6 0 0 0 13.2 0"/><path d="M12 17.6v3.2"/></svg>
  </button>
  <button class="round dark" id="end" hidden aria-label="End conversation">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
  </button>
</footer>

<audio id="sink" autoplay></audio>

<script>
const $ = id => document.getElementById(id);
const feed = $('feed'), bar = $('bar');

/* gpt-realtime-2.1 published audio rates, per 1M tokens */
const RATE_IN = 32.0, RATE_OUT = 64.0;

/* Backend location. Empty = same origin (the Python server serves this file).
   On GitHub Pages the page is static, so pass ?api=https://your-backend */
const Q = new URLSearchParams(location.search);
const API = (Q.get('api') || '').replace(/\/$/, '');
const api = p => API + p;

let pc, dc, mic, actx, anaMic, anaAi, model = '';
let audioIn = 0, audioOut = 0, spokeAt = null, lags = [];
let aiUntil = 0;   /* fallback if the remote analyser reports silence */

/* ===================== the sphere =====================
   A soft body of light rather than a waveform. Base is a radial gradient; the
   wisps are drifting radial-gradient blobs clipped to the circle, which gives
   cloud texture without depending on canvas filter support (Safari). Level
   drives radius, wisp speed, and hue: cooler blue while the analyst speaks,
   warmer lilac while you do. */
const cv = $('orb'), g = cv.getContext('2d');
let dpr = 1, tone = 0, lvl = 0;

/* fixed wisp field: position, size and drift are seeded once so the motion
   reads as one continuous body instead of random flicker */
const WISPS = Array.from({ length: 9 }, (_, i) => ({
  a: (i / 9) * Math.PI * 2,
  r: 0.18 + (i % 4) * 0.13,
  s: 0.42 + (i % 3) * 0.2,
  sp: (i % 2 ? 1 : -1) * (0.00006 + (i % 5) * 0.00002),
  w: i % 3 === 0 ? 1 : 0.62,
  flat: 0.24 + (i % 4) * 0.11,   /* squash: lower = thinner cloud band */
}));

function size() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width * dpr);
  cv.height = Math.max(1, r.height * dpr);
}
addEventListener('resize', size);

const bufM = new Uint8Array(1024), bufA = new Uint8Array(1024);
function energy(ana, buf) {
  if (!ana) return 0;
  ana.getByteFrequencyData(buf);
  let s = 0; for (let i = 0; i < 44; i++) s += buf[i];
  return s / (44 * 255);
}

function frame(t) {
  requestAnimationFrame(frame);
  const w = cv.width, h = cv.height;
  if (!w) return;

  const eM = energy(anaMic, bufM);
  let   eA = energy(anaAi, bufA);
  if (eA < 0.01 && performance.now() < aiUntil) eA = 0.15 + Math.sin(t / 95) * 0.06;

  lvl  += (Math.max(eM, eA) - lvl) * 0.12;
  tone += ((eA > eM ? 1 : 0) - tone) * 0.045;

  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.245 * (1 + Math.sin(t / 2600) * 0.012 + lvl * 0.1);

  /* sky, not lilac: pale daylight blue (you) -> deeper sky (analyst) */
  const mixC = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * tone));
  const deep = mixC([150, 190, 246], [122, 158, 240]);
  const pale = mixC([236, 244, 255], [226, 238, 254]);
  const rgb = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ambient halo */
  const halo = g.createRadialGradient(cx, cy, R * 0.7, cx, cy, R * 2.15);
  halo.addColorStop(0, rgb(deep, 0.16 + lvl * 0.1));
  halo.addColorStop(1, rgb(deep, 0));
  g.fillStyle = halo;
  g.fillRect(0, 0, w, h);

  /* body */
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();

  const base = g.createLinearGradient(cx + R * 0.5, cy - R, cx - R * 0.6, cy + R);
  base.addColorStop(0, rgb(deep, 1));
  base.addColorStop(0.55, rgb(mixC([203, 205, 250], [201, 210, 251]), 1));
  base.addColorStop(1, rgb(pale, 1));
  g.fillStyle = base;
  g.fillRect(cx - R, cy - R, R * 2, R * 2);

  /* Cloud banks. Real clouds are stretched and layered, not round, so each
     wisp is drawn as a radial gradient squashed on one axis and tilted along a
     shared diagonal. That diagonal is what makes it read as weather rather
     than as glowing blobs. */
  const TILT = -0.42;
  for (const p of WISPS) {
    const ang = p.a + t * p.sp * (1 + lvl * 5);
    const d = R * p.r;
    g.save();
    g.translate(cx + Math.cos(ang) * d, cy + Math.sin(ang * 1.3) * d * 0.7);
    g.rotate(TILT + Math.sin(t / 9000 + p.a) * 0.22);
    g.scale(1, p.flat);                       /* squash into a band */
    const rad = R * p.s * (1 + Math.sin(t / 3000 + p.a) * 0.13);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, rad);
    gr.addColorStop(0,    `rgba(255,255,255,${0.62 * p.w})`);
    gr.addColorStop(0.32, `rgba(255,255,255,${0.30 * p.w})`);
    gr.addColorStop(0.68, `rgba(255,255,255,${0.09 * p.w})`);
    gr.addColorStop(1,    'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, rad, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  /* inner shading so it reads spherical, not as a flat disc */
  const sh = g.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1,
                                    cx, cy, R * 1.15);
  sh.addColorStop(0, 'rgba(255,255,255,.46)');
  sh.addColorStop(0.62, 'rgba(255,255,255,0)');
  sh.addColorStop(1, rgb(deep, 0.3));
  g.fillStyle = sh;
  g.fillRect(cx - R, cy - R, R * 2, R * 2);
  g.restore();

  /* the faintest rim, to seat it against the paper */
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
  g.strokeStyle = rgb(deep, 0.14); g.lineWidth = 1 * dpr; g.stroke();
}
size(); requestAnimationFrame(frame);

/* ===================== chrome ===================== */
function line(cls, who, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.innerHTML = `<span class="who">${who}</span>`;
  el.appendChild(document.createTextNode(text));
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
  while (feed.children.length > 60) feed.removeChild(feed.firstChild);
}
const say = (t, cls = '') => { bar.innerHTML = ''; bar.textContent = t; bar.className = 'bar ' + cls; };

function stats() {
  const cost = (audioIn / 1e6) * RATE_IN + (audioOut / 1e6) * RATE_OUT;
  const lag = lags.length
    ? Math.round(lags.reduce((a, b) => a + b, 0) / lags.length) + 'ms' : '--';
  $('meter').textContent =
    `${lag}  ·  ${(audioIn + audioOut).toLocaleString()} tok  ·  $${cost.toFixed(3)}`;
}
const send = o => { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(o)); };

/* ===================== tools ===================== */
async function runTool(name, callId, argsJson) {
  line('call', 'query', `${name} ${argsJson}`);
  let out;
  try {
    const r = await fetch(api('/api/tool'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, arguments: argsJson })
    });
    const j = await r.json();
    out = j.result;
    line('call', 'returned', `${name} in ${j.ms}ms`);
  } catch (e) {
    out = { error: String(e) };
    line('err', 'failed', `${name}: ${e}`);
  }
  send({ type: 'conversation.item.create',
         item: { type: 'function_call_output', call_id: callId, output: JSON.stringify(out) } });
  send({ type: 'response.create' });
}

/* ===================== events ===================== */
function onEvent(ev) {
  switch (ev.type) {
    case 'input_audio_buffer.speech_started': spokeAt = null; say('Listening', 'live'); break;
    case 'input_audio_buffer.speech_stopped': spokeAt = performance.now(); say('Thinking', 'live'); break;

    case 'conversation.item.input_audio_transcription.completed':
      if (ev.transcript) line('', 'you', ev.transcript.trim());
      break;

    case 'response.output_audio_transcript.delta':
      aiUntil = performance.now() + 900;
      say('Speaking', 'live');
      if (spokeAt !== null) { lags.push(performance.now() - spokeAt); spokeAt = null; stats(); }
      break;

    case 'response.output_audio_transcript.done':
      if (ev.transcript) line('ai', 'analyst', ev.transcript.trim());
      break;

    case 'response.function_call_arguments.done':
      runTool(ev.name, ev.call_id, ev.arguments); break;

    case 'response.done': {
      say('Listening', 'live');
      const u = ev.response && ev.response.usage;
      if (u) {
        audioIn  += (u.input_token_details  || {}).audio_tokens || 0;
        audioOut += (u.output_token_details || {}).audio_tokens || 0;
        stats();
        fetch(api('/api/trace'), { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usage: u, lags }) }).catch(() => {});
      }
      break;
    }

    case 'error':
      line('err', 'error', JSON.stringify(ev.error));
      say('Error, open the transcript', 'bad');
      break;
  }
}

/* ===================== access ===================== */
/* The passphrase can arrive three ways: in the link (?k=), remembered from a
   previous visit, or typed. Typing is the one worth optimising for, since a
   passphrase in a URL ends up in history and in anything the link is pasted
   into. Remembered in localStorage so a tester enters it once per device. */
const KEY_STORE = 'formd.k';
function haveKey() {
  return Q.get('k') || localStorage.getItem(KEY_STORE) || '';
}

function askForKey() {
  bar.className = 'bar';
  bar.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'password';
  input.placeholder = 'Passphrase';
  input.autocomplete = 'current-password';
  input.spellcheck = false;
  bar.appendChild(input);
  input.focus();
  $('go').textContent = 'Enter';
  $('go').disabled = false;
  $('go').onclick = submit;
  input.onkeydown = e => { if (e.key === 'Enter') submit(); };

  function submit() {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    localStorage.setItem(KEY_STORE, v);
    $('go').textContent = 'Start';
    $('go').onclick = start;
    start();
  }
}

/* ===================== lifecycle ===================== */
async function start() {
  const key = haveKey();
  if (!key) return askForKey();

  $('go').disabled = true;
  try {
    say('Authorising');
    const s = await fetch(api('/session?k=' + encodeURIComponent(key)), { method: 'POST' });
    if (s.status === 403) {
      localStorage.removeItem(KEY_STORE);
      say('Wrong passphrase', 'bad');
      return askForKey();
    }
    if (!s.ok) throw new Error((await s.text()).slice(0, 220));
    const j = await s.json();
    if (!j.token) throw new Error('no token in /session response');
    model = j.model; $('model').textContent = model;

    say('Allow the microphone');
    mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true } });

    actx = new (window.AudioContext || window.webkitAudioContext)();
    anaMic = actx.createAnalyser(); anaMic.fftSize = 2048; anaMic.smoothingTimeConstant = .75;
    actx.createMediaStreamSource(mic).connect(anaMic);

    say('Connecting');
    pc = new RTCPeerConnection();
    pc.ontrack = e => {
      $('sink').srcObject = e.streams[0];
      try {
        anaAi = actx.createAnalyser(); anaAi.fftSize = 2048; anaAi.smoothingTimeConstant = .75;
        /* analyser only, never to destination: the <audio> element plays it */
        actx.createMediaStreamSource(e.streams[0]).connect(anaAi);
      } catch (_) { /* event-driven fallback covers this */ }
    };
    pc.addTrack(mic.getAudioTracks()[0], mic);

    dc = pc.createDataChannel('oai-events');
    dc.onmessage = e => { try { onEvent(JSON.parse(e.data)); } catch (_) {} };
    dc.onopen = () => { say('Listening', 'live'); line('call', 'session', model + ' open'); };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const r = await fetch('https://api.openai.com/v1/realtime/calls?model=' + encodeURIComponent(model), {
      method: 'POST', body: offer.sdp,
      headers: { Authorization: 'Bearer ' + j.token, 'Content-Type': 'application/sdp' } });
    if (!r.ok) throw new Error('SDP exchange failed: ' + (await r.text()).slice(0, 220));
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });

    $('go').hidden = true; $('mute').hidden = false; $('end').hidden = false;
    $('meter').classList.add('show'); stats();
  } catch (e) {
    line('err', 'error', String(e));
    say(String(e).slice(0, 120), 'bad');
    $('go').disabled = false;
  }
}

function stop() {
  if (pc) pc.close();
  if (mic) mic.getTracks().forEach(t => t.stop());
  if (actx) actx.close();
  pc = dc = mic = actx = anaMic = anaAi = null;
  $('go').hidden = false; $('go').disabled = false; $('go').textContent = 'Resume';
  $('mute').hidden = true; $('end').hidden = true;
  $('mute').classList.remove('muted');
  say('Ended');
}

$('go').onclick = start;
$('end').onclick = stop;
$('mute').onclick = () => {
  if (!mic) return;
  const tr = mic.getAudioTracks()[0];
  tr.enabled = !tr.enabled;
  $('mute').classList.toggle('muted', !tr.enabled);
  say(tr.enabled ? 'Listening' : 'Muted', tr.enabled ? 'live' : '');
};
$('btnFeed').onclick = e => {
  feed.classList.toggle('show');
  e.currentTarget.classList.toggle('on', feed.classList.contains('show'));
};
$('btnMeter').onclick = e => {
  $('meter').classList.toggle('show');
  e.currentTarget.classList.toggle('on', $('meter').classList.contains('show'));
};

/* A first-time visitor lands straight on the passphrase field, already focused.
   Open, type, Enter. No button to discover first. */
if (!haveKey()) askForKey();
</script>
</body>
</html>
