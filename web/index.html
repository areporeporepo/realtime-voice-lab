<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form D Analyst</title>
<style>
  :root {
    --bg: #0c0d10; --panel: #14161b; --line: #23262e;
    --fg: #e7e9ee; --dim: #8b90a0; --accent: #5eead4; --warn: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 12px;
  }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 12px; }
  button {
    font: 600 16px/1 inherit; color: #04120f; background: var(--accent);
    border: 0; border-radius: 12px; padding: 16px 20px; width: 100%;
    cursor: pointer; transition: opacity .15s;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.stop { background: #f87171; color: #1a0505; }
  #status {
    font: 500 13px/1 ui-monospace, SFMono-Regular, monospace;
    color: var(--dim); padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  #status.live { color: var(--accent); }
  #status.err  { color: #f87171; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px;
  }
  .stat b { display: block; font: 600 18px/1.2 ui-monospace, monospace; }
  .stat span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  #log {
    flex: 1; min-height: 160px; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font: 13px/1.55 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap;
  }
  .u { color: var(--fg); }
  .a { color: var(--accent); }
  .t { color: var(--warn); }
  .e { color: #f87171; }
  .hint { color: var(--dim); font-size: 12px; }
  .hint code { color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Form D Analyst</h1>
  <span class="sub">32,374 SEC filings &middot; Jan&ndash;Jun 2026 &middot; <span id="model">&hellip;</span></span>
</header>

<button id="go">Start talking</button>
<div id="status">idle</div>

<div class="grid">
  <div class="stat"><span>Reply lag</span><b id="m-lag">&mdash;</b></div>
  <div class="stat"><span>Audio tok</span><b id="m-tok">0</b></div>
  <div class="stat"><span>Est. cost</span><b id="m-cost">$0.00</b></div>
</div>

<div id="log"></div>

<p class="hint">Try: <code>What were the three biggest technology raises in California this year?</code></p>

<audio id="sink" autoplay></audio>

<script>
const $ = id => document.getElementById(id);
const log = $('log');

// gpt-realtime-2.1 published audio rates, per 1M tokens.
const RATE_IN = 32.0, RATE_OUT = 64.0;

let pc, dc, mic, model = '';
let audioIn = 0, audioOut = 0;
let spokeAt = null, lags = [];

function say(cls, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function status(text, cls = '') {
  $('status').textContent = text;
  $('status').className = cls;
}

function refreshStats() {
  $('m-tok').textContent = (audioIn + audioOut).toLocaleString();
  const cost = (audioIn / 1e6) * RATE_IN + (audioOut / 1e6) * RATE_OUT;
  $('m-cost').textContent = '$' + cost.toFixed(4);
  if (lags.length) {
    const avg = lags.reduce((a, b) => a + b, 0) / lags.length;
    $('m-lag').textContent = Math.round(avg) + 'ms';
  }
}

function send(obj) {
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(obj));
}

async function runTool(name, callId, argsJson) {
  say('t', `-> ${name}(${argsJson})`);
  let out;
  try {
    const r = await fetch('/api/tool', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, arguments: argsJson })
    });
    const j = await r.json();
    out = j.result;
    say('t', `<- ${name} ${j.ms}ms`);
  } catch (e) {
    out = { error: String(e) };
    say('e', `<- ${name} failed: ${e}`);
  }
  send({
    type: 'conversation.item.create',
    item: { type: 'function_call_output', call_id: callId, output: JSON.stringify(out) }
  });
  send({ type: 'response.create' });
}

function onEvent(ev) {
  switch (ev.type) {
    case 'input_audio_buffer.speech_started':
      spokeAt = null;
      break;
    case 'input_audio_buffer.speech_stopped':
      spokeAt = performance.now();
      break;

    case 'conversation.item.input_audio_transcription.completed':
      say('u', 'you: ' + (ev.transcript || '').trim());
      break;

    case 'response.output_audio_transcript.delta':
      if (spokeAt !== null) { lags.push(performance.now() - spokeAt); spokeAt = null; refreshStats(); }
      break;
    case 'response.output_audio_transcript.done':
      say('a', 'ai:  ' + (ev.transcript || '').trim());
      break;

    case 'response.function_call_arguments.done':
      runTool(ev.name, ev.call_id, ev.arguments);
      break;

    case 'response.done': {
      const u = ev.response && ev.response.usage;
      if (u) {
        audioIn  += (u.input_token_details  || {}).audio_tokens || 0;
        audioOut += (u.output_token_details || {}).audio_tokens || 0;
        refreshStats();
        fetch('/api/trace', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usage: u, lags })
        }).catch(() => {});
      }
      break;
    }

    case 'error':
      say('e', 'error: ' + JSON.stringify(ev.error));
      status('error, see log', 'err');
      break;
  }
}

async function start() {
  $('go').disabled = true;
  try {
    status('minting token...');
    // Forward the access key from our own URL (?k=...) so the server can gate
    // who is allowed to spend OpenAI credit.
    const k = new URLSearchParams(location.search).get('k') || '';
    const s = await fetch('/session?k=' + encodeURIComponent(k), { method: 'POST' });
    if (!s.ok) throw new Error((await s.text()).slice(0, 300));
    const { token, model: m } = await s.json();
    if (!token) throw new Error('no token in /session response');
    model = m;
    $('model').textContent = m;

    status('requesting microphone...');
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });

    status('connecting to OpenAI...');
    pc = new RTCPeerConnection();
    pc.ontrack = e => { $('sink').srcObject = e.streams[0]; };
    pc.addTrack(mic.getAudioTracks()[0], mic);

    dc = pc.createDataChannel('oai-events');
    dc.onmessage = e => { try { onEvent(JSON.parse(e.data)); } catch {} };
    dc.onopen = () => { status('live, start talking', 'live'); say('t', 'session open'); };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const r = await fetch('https://api.openai.com/v1/realtime/calls?model=' + encodeURIComponent(m), {
      method: 'POST',
      body: offer.sdp,
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/sdp' }
    });
    if (!r.ok) throw new Error('SDP exchange failed: ' + (await r.text()).slice(0, 300));
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });

    $('go').textContent = 'Stop';
    $('go').className = 'stop';
    $('go').disabled = false;
    $('go').onclick = stop;
  } catch (e) {
    say('e', String(e));
    status('failed: ' + String(e).slice(0, 120), 'err');
    $('go').disabled = false;
  }
}

function stop() {
  if (pc) pc.close();
  if (mic) mic.getTracks().forEach(t => t.stop());
  pc = dc = mic = null;
  status('stopped');
  $('go').textContent = 'Start talking';
  $('go').className = '';
  $('go').onclick = start;
}

$('go').onclick = start;
</script>
</body>
</html>
